name: Nightly BOARD backup

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button for manual backups

permissions:
  contents: write

concurrency:
  group: board-backup      # never run two backups at once
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download proposals, catalogue and files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node backup.mjs
      - name: Save to repository
        run: |
          git config user.name "BOARD backup"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
